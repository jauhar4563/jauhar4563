name: Refresh profile artwork

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [codex/profile-midnight-cyan-violet]
    paths:
      - README.md
      - scripts/**
      - tests/**
      - .github/workflows/profile.yml

permissions:
  contents: read

concurrency:
  group: profile-artwork-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify contribution calculations
        run: python -m unittest discover -s tests -v
      - name: Generate account activity cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/activity.py --login jauhar4563 --output .profile-build
      - name: Animate the contribution calendar
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: jauhar4563
          github_token: ${{ github.token }}
          outputs: |
            .profile-build/snake-dark.svg?palette=github-dark&color_snake=#A78BFA&color_dots=#161B22,#164E63,#0E7490,#22D3EE,#A78BFA
            .profile-build/snake-light.svg?palette=github-light&color_snake=#7C3AED&color_dots=#EAEFF5,#CFFAFE,#67E8F9,#0891B2,#7C3AED
      - name: Validate all generated SVGs
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for name in ('contributions.svg', 'streak.svg', 'snake-dark.svg', 'snake-light.svg'):
              root = ET.parse(Path('.profile-build') / name).getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg', name
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-artwork
          path: |
            .profile-build/*.svg
            .profile-build/README.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: profile-artwork
          path: .profile-build
      - name: Publish only a complete successful refresh
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p assets/generated
          cp .profile-build/contributions.svg .profile-build/streak.svg .profile-build/snake-dark.svg .profile-build/snake-light.svg assets/generated/
          cp .profile-build/README.md README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated README.md
          if git diff --cached --quiet; then
            echo "Profile artwork is already current."
          else
            git commit -m "Refresh public contribution artwork"
            git push origin "HEAD:$TARGET_BRANCH"
          fi

